    <style>
        .glass-card {
            background: rgba(16, 20, 21, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }

        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }

            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        .ambient-glow {
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
        }

        /* Hide navigation shells as per instructions for transactional/onboarding flows */
        .nav-hidden {
            display: none;
        }
    </style>

<body class="bg-surface text-on-surface font-body-md overflow-hidden h-screen w-full flex items-center justify-center">
    <!-- Background Layer -->
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-black/40 z-10"></div>
        <img alt="Indonesian Fantasy Landscape"
            class="w-full h-full object-cover scale-105 animate-[pulse_10s_infinite_alternate]"

        <!-- Animated Accents -->
        <div class="ambient-glow absolute top-1/4 -left-20 w-96 h-96 bg-primary rounded-full"></div>
        <div class="ambient-glow absolute bottom-1/4 -right-20 w-96 h-96 bg-secondary rounded-full"></div>
    </div>
    <!-- Main Content Canvas -->
    <main class="relative z-20 w-full max-w-[390px] px-6 h-full flex flex-col justify-center items-center">
        <!-- Mobile Header (Simplified) -->
        <header class="absolute top-8 left-0 w-full px-8 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary"
                    style="font-variation-settings: 'FILL' 1;">language</span>
                <span class="font-label-caps text-label-caps text-on-surface">ID</span>
            </div>
            <button
                class="w-10 h-10 flex items-center justify-center rounded-xl glass-card transition-transform active:scale-90">
                <span class="material-symbols-outlined text-primary">menu</span>
            </button>
        </header>
        <!-- Vertical Glassmorphic Login Card -->
        <div
            class="glass-card w-full rounded-[32px] p-8 flex flex-col items-center text-center space-y-8 animate-[fadeIn_0.8s_ease-out]">
            <!-- Brand Cluster -->
            <div class="space-y-4">
                <div class="relative w-24 h-24 mx-auto group">
                    <div
                        class="absolute inset-0 bg-primary/20 blur-xl group-hover:bg-primary/40 transition-colors rounded-full">
                    </div>
                    <img alt="Sinopi Quest Logo"
                        class="relative z-10 w-full h-full object-contain drop-shadow-[0_0_15px_rgba(78,222,163,0.5)]"
                        src="https://lh3.googleusercontent.com/aida/AP1WRLsn9gRDOJvMYg61-qN1tOE9B_weHF_atbYj72zKNbBOWRnt64UfT6aTeEtOouyrpSeii2M2GgnGceT6WfoCWM6qEN40hdvPh-lO0gUBOYLsYHap_Yql-wB4xoG5kSKkcROm3MWbcl8MglmZLcCWkFDZ3a4ccopOu8zSDrG6vjsxo_O3apCZVukkBRIFGybkBDqCtgu7Y7cKm3QCwn1rSw20y72rqzx37IRbBNxIYmsvF6J7QYUMpe7fxYny" />
                </div>
                <div class="space-y-1">
                    <h1 class="font-headline-md text-headline-md font-bold tracking-[0.2em] text-on-surface uppercase">
                        SINOPI QUEST</h1>
                    <p class="font-label-caps text-[10px] text-primary tracking-[0.3em] font-bold">BERMAIN, MENJELAJAH,

                </div>
            </div>
            <!-- Login Section -->

                <!-- Google Auth Button -->

    <!-- Contextual FAB (Hidden on Login per Instruction) -->
    <div class="hidden">
        <button
            class="fixed bottom-8 right-8 w-14 h-14 bg-primary text-on-primary rounded-full shadow-2xl flex items-center justify-center active:scale-95 transition-transform">
            <span class="material-symbols-outlined">help_outline</span>
        </button>
    </div>
    <!-- Micro-interaction Script -->
    <script>
        document.addEventListener('mousemove', (e) => {
            const glow1 = document.querySelector('.ambient-glow:first-child');
            const glow2 = document.querySelector('.ambient-glow:last-child');

            const moveX = (e.clientX - window.innerWidth / 2) * 0.05;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.05;

            glow1.style.transform = `translate(${moveX}px, ${moveY}px)`;
            glow2.style.transform = `translate(${-moveX}px, ${-moveY}px)`;
        });

        // Simple Fade-in Animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
